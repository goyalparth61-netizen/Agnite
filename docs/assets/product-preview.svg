    <rect x="42" y="170" width="186" height="42" rx="10" fill="#202a34" stroke="#4b5a69"/><text x="63" y="196" fill="#f1eee8" font-weight="700">◉  Satellite feed</text>
    <text x="63" y="244">◆  AGNITE AI</text>
    <text x="63" y="286">◌  Risk</text>
    <text x="63" y="328">◉  Alerts</text>
    <text x="63" y="370">↺  Saved reports</text>
    <text x="63" y="412">⇧  Import data</text>
    <text x="63" y="454">✦  Ask AGNITE</text>
  </g>
  <line x1="43" y1="486" x2="226" y2="486" stroke="#2c3742"/>
  <text x="48" y="518" fill="#e6b477" font-family="Arial, sans-serif" font-size="11" font-weight="700">TRACEABLE EVIDENCE</text>
  <text x="48" y="542" fill="#8e9aa5" font-family="Arial, sans-serif" font-size="10">Satellite detections</text>
  <text x="48" y="560" fill="#8e9aa5" font-family="Arial, sans-serif" font-size="10">Historical context</text>
  <text x="48" y="578" fill="#8e9aa5" font-family="Arial, sans-serif" font-size="10">Conservative recurrence</text>

  <!-- main heading -->
  <text x="276" y="145" fill="#87afd4" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">INDIA REGION / THERMAL OBSERVATIONS</text>
  <text x="276" y="183" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="30" font-weight="700">Satellite feed</text>
  <text x="276" y="208" fill="#9da9b4" font-family="Arial, sans-serif" font-size="12">Select a hotspot, compare its history and follow the evidence.</text>

  <!-- map -->
  <rect x="276" y="232" width="720" height="360" rx="16" fill="url(#map)" stroke="#34414d" filter="url(#soft)"/>
  <rect x="276" y="232" width="720" height="360" rx="16" fill="url(#grid)"/>
  <path d="M624 280c-25 10-51 29-72 54-18 22-26 48-18 72 7 22 28 36 42 55 11 14 13 34 25 47 12 13 36 16 52 7 18-10 28-31 43-47 18-20 47-33 57-58 11-28-2-61-24-81-20-19-48-28-74-40-12-5-20-13-31-9z" fill="#263847" stroke="#6d8499" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="614" cy="361" r="12" fill="#e6b477" filter="url(#glow)"/>
  <circle cx="614" cy="361" r="4" fill="#fff0d5"/>
  <circle cx="696" cy="426" r="9" fill="#df7f6d" filter="url(#glow)"/>
  <circle cx="562" cy="458" r="7" fill="#87afd4"/>
  <circle cx="748" cy="334" r="6" fill="#e6b477"/>
  <rect x="298" y="252" width="220" height="66" rx="12" fill="#111820" fill-opacity=".95" stroke="#364452"/>
  <text x="316" y="275" fill="#87afd4" font-family="Arial, sans-serif" font-size="9" font-weight="700">SELECTED HOTSPOT</text>
  <text x="316" y="296" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="14" font-weight="700">21.1466, 79.0889</text>
  <text x="316" y="312" fill="#9da9b4" font-family="Arial, sans-serif" font-size="9">FRP 88 MW · rising thermal signal</text>

