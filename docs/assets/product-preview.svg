<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AGNITE thermal intelligence workspace preview</title>
  <desc id="desc">Dark interface preview showing satellite feed, India map, selected hotspot analysis, recurrence cards and AGNITE AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#151d25"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c48b"/>
      <stop offset="1" stop-color="#e58b63"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#202c36"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M 34 0 L 0 0 0 34" fill="none" stroke="#7f95aa" stroke-opacity=".07" stroke-width="1"/></pattern>
  </defs>

  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="818" rx="27" fill="none" stroke="#2f3944"/>

  <!-- topbar -->
  <rect x="26" y="24" width="1388" height="74" rx="18" fill="#111820" stroke="#2c3742" filter="url(#soft)"/>
  <rect x="44" y="37" width="48" height="48" rx="13" fill="#181d22" stroke="#e6b477" stroke-opacity=".55"/>
  <path d="M69 48c-9 8-13 16-7 25 3 5 7 7 11 7 8 0 14-6 14-14 0-7-4-12-10-17 1 5-2 8-4 10-1-4-2-7-4-11z" fill="url(#amber)" filter="url(#glow)"/>
  <text x="108" y="59" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AGNITE</text>
  <text x="108" y="78" fill="#9eabb7" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.4">THERMAL INTELLIGENCE WORKSPACE</text>
  <rect x="1134" y="44" width="124" height="34" rx="17" fill="#12231f" stroke="#3a7668"/>
  <circle cx="1153" cy="61" r="5" fill="#79d4b6"/>
  <text x="1166" y="65" fill="#a6e9d3" font-family="Arial, sans-serif" font-size="10" font-weight="700">NASA FIRMS / NRT</text>
  <rect x="1270" y="44" width="126" height="34" rx="8" fill="#202a34" stroke="#3a4652"/>
  <text x="1298" y="65" fill="#dfe5ea" font-family="Arial, sans-serif" font-size="11" font-weight="700">OVERVIEW ↗</text>

  <!-- sidebar -->
  <rect x="26" y="116" width="218" height="678" rx="18" fill="#111820" stroke="#2c3742"/>
  <text x="48" y="150" fill="#87afd4" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">MISSION WORKSPACE</text>
