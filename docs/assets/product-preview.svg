  <rect x="1016" y="232" width="398" height="360" rx="16" fill="#111820" stroke="#34414d" filter="url(#soft)"/>
  <text x="1042" y="262" fill="#87afd4" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">AGNITE ANALYSIS</text>
  <text x="1042" y="292" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="21" font-weight="700">Signal + history + context</text>
  <rect x="1042" y="314" width="346" height="62" rx="12" fill="#1a222b" stroke="#34414d"/>
  <text x="1058" y="337" fill="#9da9b4" font-family="Arial, sans-serif" font-size="10">Historical baseline</text>
  <text x="1058" y="360" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="18" font-weight="700">29.4 MW → 88 MW</text>
  <text x="1280" y="360" fill="#efb483" font-family="Arial, sans-serif" font-size="11" font-weight="700">RISING</text>
  <rect x="1042" y="390" width="108" height="82" rx="12" fill="#1a222b" stroke="#34414d"/>
  <rect x="1160" y="390" width="108" height="82" rx="12" fill="#1a222b" stroke="#34414d"/>
  <rect x="1278" y="390" width="110" height="82" rx="12" fill="#1a222b" stroke="#34414d"/>
  <text x="1055" y="413" fill="#9da9b4" font-family="Arial" font-size="9">PASSES</text><text x="1055" y="445" fill="#f4f1ea" font-family="Arial" font-size="22" font-weight="700">6</text>
  <text x="1173" y="413" fill="#9da9b4" font-family="Arial" font-size="9">PERSISTENCE</text><text x="1173" y="445" fill="#f4f1ea" font-family="Arial" font-size="22" font-weight="700">100</text>
  <text x="1291" y="413" fill="#9da9b4" font-family="Arial" font-size="9">CONTEXT</text><text x="1291" y="445" fill="#f4f1ea" font-family="Arial" font-size="16" font-weight="700">Industrial</text>
  <text x="1042" y="505" fill="#e6b477" font-family="Arial" font-size="10" font-weight="700">EXPLAINABLE OUTPUT</text>
  <text x="1042" y="529" fill="#9da9b4" font-family="Arial" font-size="10">Classification, missing evidence and reasons stay visible.</text>
  <rect x="1042" y="548" width="150" height="26" rx="13" fill="#2b2119" stroke="#7a5838"/><text x="1061" y="566" fill="#efc08a" font-family="Arial" font-size="9" font-weight="700">HIGH ATTENTION</text>

  <!-- bottom cards -->
  <text x="276" y="630" fill="#87afd4" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1.2">THERMAL RECURRENCE MODEL v2.0.0</text>
