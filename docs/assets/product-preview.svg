    <rect x="276" y="648" width="216" height="116" rx="14" fill="#111820" stroke="#34414d"/>
    <rect x="510" y="648" width="216" height="116" rx="14" fill="#111820" stroke="#34414d"/>
    <rect x="744" y="648" width="216" height="116" rx="14" fill="#111820" stroke="#34414d"/>
    <rect x="978" y="648" width="436" height="116" rx="14" fill="#111820" stroke="#34414d"/>
  </g>
  <text x="298" y="674" fill="#9da9b4" font-family="Arial" font-size="9">NEXT 24 HOURS</text><text x="298" y="708" fill="#f4f1ea" font-family="Arial" font-size="22" font-weight="700">98.25%</text><text x="298" y="730" fill="#d08b76" font-family="Arial" font-size="9" font-weight="700">99% TARGET NOT MET</text><text x="298" y="748" fill="#7f8b96" font-family="Arial" font-size="8">selective held-out precision</text>
  <text x="532" y="674" fill="#9da9b4" font-family="Arial" font-size="9">NEXT 48 HOURS</text><text x="532" y="708" fill="#f4f1ea" font-family="Arial" font-size="22" font-weight="700">99.06%</text><text x="532" y="730" fill="#7bd0b3" font-family="Arial" font-size="9" font-weight="700">TARGET MET</text><text x="532" y="748" fill="#7f8b96" font-family="Arial" font-size="8">precision · recall 0.18%</text>
  <text x="766" y="674" fill="#9da9b4" font-family="Arial" font-size="9">NEXT 7 DAYS</text><text x="766" y="708" fill="#f4f1ea" font-family="Arial" font-size="22" font-weight="700">99.06%</text><text x="766" y="730" fill="#7bd0b3" font-family="Arial" font-size="9" font-weight="700">TARGET MET</text><text x="766" y="748" fill="#7f8b96" font-family="Arial" font-size="8">precision · recall 0.55%</text>
  <text x="1004" y="674" fill="#87afd4" font-family="Arial" font-size="9" font-weight="700">ASK AGNITE AI</text>
  <text x="1004" y="700" fill="#f4f1ea" font-family="Arial" font-size="13" font-weight="700">“Why did this signal change?”</text>
  <text x="1004" y="723" fill="#9da9b4" font-family="Arial" font-size="10">Grounded explanation from selected-site evidence,</text>
  <text x="1004" y="741" fill="#9da9b4" font-family="Arial" font-size="10">history, context and model limitations.</text>

  <text x="720" y="801" text-anchor="middle" fill="#65717c" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.4">CURRENT AGNITE INTERFACE PREVIEW · TEAM TIMEPASS · SIH 2026</text>
</svg>
