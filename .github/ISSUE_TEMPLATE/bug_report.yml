name: Bug report
description: Report a reproducible AGNITE defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AGNITE. Do not include API keys, email addresses, alert tokens or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and the expected behaviour.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Homepage / navigation
        - NASA FIRMS feed
        - Map / location selection
        - Classification / analysis
        - Risk / recurrence
        - AGNITE AI
        - Alerts / email
        - Import / export
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets/private information before attaching anything.
  - type: input
    id: commit
    attributes:
      label: Commit / branch
      placeholder: main / commit SHA
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this does not expose a secret or private user data.
          required: true
        - label: I checked existing issues for a duplicate.
          required: true
