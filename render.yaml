services:
  - type: web
    name: agnite
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: AGNITE_ALERT_STORE
        value: /var/data/agnite-alerts.json
    disk:
      name: agnite-data
      mountPath: /var/data
      sizeGB: 1
